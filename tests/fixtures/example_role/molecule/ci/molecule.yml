# Docker driver, not the Vagrant driver generated runs use locally - see
# docs/METHODOLOGY.md (week 4). GitHub's hosted runners support Docker
# natively but not nested virtualization, so this scenario exists
# specifically for CI rather than being what `provision` generates.
driver:
  name: docker
platforms:
  - name: instance
    # Includes systemd, which our role's `ansible.builtin.service` task
    # needs to actually manage sshd inside the container - the standard
    # base image for Ansible role testing via Molecule+Docker. The 2004
    # (Ubuntu 20.04) variant was tried first and confirmed broken by
    # actually running this job: it ships Python 3.8, but the ansible-core
    # this job pip-installs (no version pin, so it's whatever's current)
    # requires Python 3.9+ on the managed node - "Ansible requires Python
    # 3.9 or newer on the target. Current version: 3.8.10". 2204 (Ubuntu
    # 22.04) ships Python 3.10, which satisfies that.
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: /usr/sbin/init
provisioner:
  name: ansible
verifier:
  name: ansible
