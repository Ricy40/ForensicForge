[project]
name = "forensicforge"
version = "0.1.0"
description = "LLM-driven pipeline for generating curriculum-aligned virtual machines and forensic training scenarios"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ollama>=0.3.0",
    "click>=8.1",
    "langchain-core>=1.5",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
    "pyyaml>=6.0",
    "python-hcl2>=8.1",
    "checkov>=3.3",
    "python-vagrant>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
forensicforge = "forensicforge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
